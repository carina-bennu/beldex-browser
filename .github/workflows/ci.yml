name: CI

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:

  # ============================================================
  # ANALYZE & TEST
  # ============================================================
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage


  # ============================================================
  # ANDROID BUILD
  # ============================================================
  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # IMPORTANT:
      # Do not manually set JAVA_HOME.
      # GitHub runner already has Java installed.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/**', 'android/**/build.gradle', 'android/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Try building App Bundle (release)
        run: |
          flutter build appbundle --release || true

      - name: List generated files
        run: |
          echo "Generated Android build files:"
          find build/app/outputs -type f -print || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error


  # ============================================================
  # DEPLOY APK TO SERVER
  # ============================================================
  deploy:
    name: Deploy APK to Server
    runs-on: ubuntu-latest
    needs: android

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: android-artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded build files:"
          find android-artifacts -type f -print

      # --------------------------------------------------------
      # SSH CONFIGURATION
      # --------------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # --------------------------------------------------------
      # TEST SSH CONNECTION
      # --------------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo 'SSH connection successful'"

      # --------------------------------------------------------
      # CREATE DEPLOYMENT DIRECTORY
      # --------------------------------------------------------
      - name: Create deployment directory
        run: |
          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}'"

      # --------------------------------------------------------
      # COPY APK TO SERVER
      # --------------------------------------------------------
      - name: Copy APK to Server
        run: |
          APK_FILES=$(find android-artifacts -type f -name "*.apk")

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi

          echo "APK files found:"
          echo "$APK_FILES"

          while IFS= read -r APK; do
            echo "Uploading: $APK"

            scp \
              -P "${{ secrets.SERVER_PORT }}" \
              "$APK" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/"

          done <<< "$APK_FILES"

      # --------------------------------------------------------
      # VERIFY DEPLOYMENT
      # --------------------------------------------------------
      - name: Verify deployment
        run: |
          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "ls -lh '${{ secrets.DEPLOY_PATH }}'"
