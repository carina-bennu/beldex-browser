name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # ============================================================
  # ANALYZE & TEST
  # ============================================================
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Flutter Pub Get
        run: flutter pub get

      # Existing analyzer issues should not block the build.
      - name: Analyze
        run: flutter analyze || true

      # Existing test failures should not block the build.
      - name: Run tests
        run: flutter test --coverage || true


  # ============================================================
  # ANDROID BUILD
  # ============================================================
  android:
    name: Android Build
    runs-on: ubuntu-latest

    # IMPORTANT:
    # Do NOT use "needs: analyze-and-test".
    # Android build must run even if flutter analyze reports issues.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure Java 17 correctly.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Show Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/**', 'android/**/build.gradle*', 'android/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Flutter Pub Get
        run: flutter pub get

      # This is the important build step.
      # If the application cannot actually compile, this job MUST fail.
      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Try building App Bundle (release)
        run: flutter build appbundle --release || true

      - name: List Android build files
        run: |
          echo "APK files:"
          find build/app/outputs/flutter-apk -type f -name "*.apk" -print || true

          echo "AAB files:"
          find build/app/outputs/bundle -type f -name "*.aab" -print || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab


  # ============================================================
  # DEPLOY APK
  # ============================================================
  deploy:
    name: Deploy APK to Server
    runs-on: ubuntu-latest
    needs: android

    steps:

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: android-artifacts

      - name: List downloaded build files
        run: |
          echo "Downloaded build files:"
          find android-artifacts -type f -print

      # --------------------------------------------------------
      # SSH CONFIGURATION
      # --------------------------------------------------------
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # --------------------------------------------------------
      # TEST SSH
      # --------------------------------------------------------
      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "echo SSH connection successful"

      # --------------------------------------------------------
      # CREATE DEPLOYMENT DIRECTORY
      # --------------------------------------------------------
      - name: Create deployment directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      # --------------------------------------------------------
      # COPY APK
      # --------------------------------------------------------
      - name: Copy APK files to Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          apk_count=0

          while IFS= read -r apk; do

            echo "Uploading: $apk"

            scp \
              -o StrictHostKeyChecking=yes \
              -P "$SERVER_PORT" \
              "$apk" \
              "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

            apk_count=$((apk_count + 1))

          done < <(find android-artifacts -type f -name "*.apk" -print)

          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No APK file was found."
            exit 1
          fi

          echo "Uploaded $apk_count APK file(s)."

      # --------------------------------------------------------
      # VERIFY DEPLOYMENT
      # --------------------------------------------------------
      - name: Show deployed files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "ls -lh '$DEPLOY_PATH'"
